name: Founding Seats Milestone

# Emails the operator when founding seats cross a threshold (default 180, then 200).
# Sends AT MOST ONCE per threshold — the guard is the ops_milestones primary key
# (migration 111), claimed atomically before the send, so hourly runs can't spam.
#
# CADENCE: hourly. Seats fill from a campaign send, not a steady drip, so 180 → 200
# could happen inside an afternoon; a daily check could report it a day late, by
# which time the decision it exists to prompt has already been made for you.
#
# NOTE (new-workflow gotcha): scheduled triggers only start once this file is on the
# DEFAULT branch. Until then use the "Run workflow" button (workflow_dispatch).
#
# REQUIRES the SYNC_ALERT_EMAIL repo secret to be set, or the job logs the milestone
# and sends nothing. It releases the milestone again in that case, so the alert is
# delayed rather than lost once the secret exists.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only — never send or record'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: founding-seats-milestone
  cancel-in-progress: false

jobs:
  check-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Check founding-seat milestones
        timeout-minutes: 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          SYNC_ALERT_EMAIL: ${{ secrets.SYNC_ALERT_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          npx tsx scripts/admin/checkFoundingMilestone.ts \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Only on failure. The routine path is silent by design — a job that runs 24
      # times a day must not email 24 times a day, or the one email that matters
      # arrives in a folder nobody reads.
      - name: Notify operator on failure
        if: failure()
        env:
          JOB_NAME: Founding Seats Milestone check
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          SYNC_ALERT_EMAIL: ${{ secrets.SYNC_ALERT_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/worker/notifyRun.ts
