name: Weekly Ghost Reconcile

# Full-inventory reconciliation ("Query D") of the Typesense `properties` (For Sale)
# index against the feed's CURRENT Active snapshot — the safety net for listings that
# left Active but whose sold/de-listed record was missed by every delta net (Query B/C
# cursor misses, outage windows, $skip drift during catch-ups). Each ghost is verified
# per-key against the VOW feed, then routed through the standard ingest paths:
# Closed → sold repair (vault + raw_vow_sold + sold_listings + stale doc delete);
# Terminated/Withdrawn/absent → cleared from the For-Sale index; Active/conditionals kept.
#
# WHY THIS EXISTS: the 2026-07-17 audit found 26,377 closed listings (Apr–Jul mod dates)
# still indexed as For Sale — 26,054 of them absent from raw_vow_sold — after the July 2–5
# Query B outage + July 6 $skip-drift catch-up (the 6 Alexie Way incident). Delta cursors
# can never re-see a record they already passed; only a full-inventory diff can.
#
# CADENCE: weekly (Sundays 08:00 UTC — after the daily sync finishes). Normal runs find a
# few hundred ghosts (~30-45 min). The notify email reports the ghost count — a SPIKE is
# the early warning that an upstream net (Query B/C) regressed again.
on:
  # NOT scheduled by GitHub. GitHub runs `schedule` at lowest priority and drops it
  # under load, hardest at minute :00 — which is where this job used to sit. Supabase
  # pg_cron POSTs a workflow_dispatch at 08:00 UTC every Sunday; see
  # supabase/migrations/128_pg_cron_weekly_monthly.sql. Change the time in cron.job,
  # NOT here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-reconcile
  cancel-in-progress: false

jobs:
  ghost-reconcile:
    runs-on: ubuntu-latest
    env:
      SUMMARY_FILE: ghost-reconcile-run.log
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Reconcile ghost actives
        # Generous cap: the Active snapshot + per-key VOW verification dominate the
        # normal ~30-45 min run; a large regression (thousands of sold repairs at
        # ~30s/100) can legitimately need hours. Timing out leaves the work resumable
        # (idempotent upserts + per-chunk doc deletes) — the next weekly run finishes.
        timeout-minutes: 240
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROPTX_IDX_TOKEN: ${{ secrets.PROPTX_IDX_TOKEN }}
          PROPTX_VOW_TOKEN: ${{ secrets.PROPTX_VOW_TOKEN }}
          TYPESENSE_ADMIN_API_KEY: ${{ secrets.TYPESENSE_ADMIN_API_KEY }}
          # Session-pooler URL for the last_seen_at heartbeat (stampLastSeenHeartbeat, raw pg).
          # If unset the reconcile still runs and the heartbeat step no-ops with a warning.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # `set -o pipefail` is load-bearing: a bash pipeline exits with the status of its
        # LAST command, so `tsx ... | tee` returned tee's 0 and the step went green even
        # when the script crashed. That masked the 2026-08-09 run, where the heartbeat
        # UPDATE hit a statement timeout, aborted ghostReconcile before the ghost-deletion
        # step, and still reported success. Without this, any future crash is invisible.
        run: |
          set -o pipefail
          npx tsx scripts/worker/ghostReconcile.ts --apply 2>&1 | tee -a "$SUMMARY_FILE"

      # The reconcile REPAIRS listings — a ghost becomes SOLD/LEASED with a close price and
      # its photos — but the detail page is cached for an hour and nothing here purged it.
      # So every repaired listing kept serving its pre-repair page. On 2026-08-27 that was
      # 2,389 of them, and it is how the sold-photo "gap" came to be reported: the page read
      # "No photos on this record" while 43 photos sat in the row it had just been given.
      # The daily sync already runs this exact step; the weekly reconcile simply never did.
      #
      # revalidateListings selects on `synced_at`, which only the repair path writes, so this
      # purges the ~2.4k genuinely-changed listings and NOT the ~82k whose orphan flag moved
      # (those bump `updated_at` only). Additive polish, never load-bearing: continue-on-error,
      # and the 1h TTL still refreshes everything on its own.
      - name: Revalidate repaired listing pages
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # The reconcile itself is capped at 240 min; 6h covers a full run plus margin
          # without reaching back into the previous day's daily-sync window.
          REVALIDATE_SINCE_HOURS: '6'
        run: npx tsx scripts/worker/revalidateListings.ts

      - name: Notify operator
        if: always()
        env:
          JOB_NAME: Weekly Ghost Reconcile
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          SYNC_ALERT_EMAIL: ${{ secrets.SYNC_ALERT_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/worker/notifyRun.ts
