name: Refresh Ontario Child Care

# Rebuilds data/ontario-child-care.json — every active licensed child care centre in
# Ontario outside the City of Toronto that serves children under school age, located by
# postal code — from the newest monthly Ontario Ministry of Education list, and commits it
# to main. /api/childcare/nearby (the "Child care nearby" block outside Toronto) and the
# map pins read that file, so the commit and the deploy it triggers are the refresh.
# Public data.ontario.ca data only: no database, no secrets.
#
# CADENCE: monthly, the 12th. The province posts each month's file around the 10th. The
# build fails (and commits nothing) if the newest file is older than 120 days, shrinks
# below 2,500 centres, or matches under 95% of postal codes.
#
# The NearestChildCareKm index field is NOT refreshed here: new listings pick the new file
# up in the transformer; existing documents need scripts/admin/backfill-child-care-fields.ts.
#
# NEW-WORKFLOW GOTCHA: workflow_dispatch only activates once this file is on main. Seed the
# first run with the Actions "Run workflow" button, or: gh workflow run refresh-ontario-child-care.yml
on:
  # NOT scheduled by GitHub (it drops `schedule` runs under load). Supabase pg_cron POSTs a
  # workflow_dispatch at 10:37 UTC on the 12th of each month —
  # supabase/migrations/175_pg_cron_ontario_child_care.sql. Change the time in cron.job, NOT here.
  workflow_dispatch:

permissions:
  contents: write # commits the data file back to main

concurrency:
  group: refresh-ontario-child-care
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Ontario child care data
        timeout-minutes: 10
        # pipefail: `tsx … | tee` otherwise returns tee's 0 and a Fatal goes green.
        run: |
          set -o pipefail
          npx tsx scripts/data/buildOntarioChildCare.ts --write 2>&1 | tee ontario-child-care-run.log

      - name: Commit data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ontario-child-care.json
          if git diff --cached --quiet; then
            echo "No change to the Ontario child care data."
          else
            git commit -m "chore(data): monthly Ontario child care refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
