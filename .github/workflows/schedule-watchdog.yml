name: Schedule Watchdog

# Watches the SCHEDULER, which nothing else in this repo does. Two failure modes, both
# completely silent today:
#
#   MISSED — GitHub never dispatches the trigger. daily-sync.yml's notify-failure job fires
#            only when a run goes red, and a run that was never dispatched has no status to
#            be red. On 2026-08-28 the 03:00 UTC sync trigger was dropped outright and the
#            first anyone knew was a user's missing nightly email.
#   LATE   — the run happens, but hours after its cron time, so a "nightly" job lands in the
#            afternoon. On 2026-08-27 the sync started 13:19 UTC for a 03:00 cron and the
#            watchlist digest went out at 12:26 PM Toronto instead of ~02:00 AM.
#
# LATE is why this measures more than staleness: a late run resets every age-based clock, so
# an age-only check reports green on exactly the day the schedule breaks. freshness-check.yml
# has that blind spot by design — it reads the DATA's age from sync_state, and at 01:54 UTC on
# 2026-08-28 it passed on a cursor refreshed 9h earlier by a run that had started 10h20m late.
#
# Since 2026-09-16 this also RE-DISPATCHES a missed job rather than only reporting it — see
# the "Re-dispatch missed workflows" step for which jobs qualify, and why it needs a PAT.
#
# Deliberately dependency-free — no checkout, no npm ci — so it stays a ~15s job and cannot
# itself be delayed by an install. Runs 4x/day at :38; a watchdog on a 4-hourly cadence
# survives GitHub dropping one of its own triggers, which a once-daily check would not.
on:
  schedule:
    - cron: '38 */4 * * *'
  workflow_dispatch:

# actions:read to list workflow runs; issues:write to raise the alert issue. The re-dispatch
# step deliberately does NOT use this token — see that step.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # Step-level `if` cannot read the secrets context, so the token is lifted to env purely to
    # be tested for presence. The re-dispatch step authenticates with the secret directly.
    env:
      DISPATCH_PAT: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
    steps:
      - name: Check every scheduled workflow for a missed or late run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // maxAgeHours ≈ 2x the cadence: GitHub routinely defers `schedule` by 20-45min
            // even when healthy, so this fires on a MISSED run, not on ordinary drift.
            // cronMinutesUtc lists the job's daily trigger slots as minutes-past-UTC-midnight
            // and is what makes the LATE check possible; omit it for a workflow whose normal
            // trigger is not a cron.
            //
            // Four of these are triggered by Supabase pg_cron now, not by GitHub's scheduler
            // (supabase/migrations/127_pg_cron_workflow_dispatch.sql). cronMinutesUtc must keep
            // matching cron.job in the database: retime a job there and retime it here too, or
            // this measures the wrong slot and reports a job late while it is on time.
            //
            // selfHeal marks a job this watchdog may re-dispatch unattended. Set it only where
            // an extra run is harmless: cheap, idempotent and silent. daily-sync runs up to
            // 300m and overlaps the estimates recompute, and nightly-emails sends a digest to
            // real people — a spurious second run of either is worse than the miss it would be
            // fixing, so both stay manual on purpose.
            const WATCHED = [
              { file: 'daily-sync.yml', label: 'Daily Real Estate Sync',
                maxAgeHours: 26, cronMinutesUtc: [3 * 60 + 17], maxDelayHours: 4 },
              // Normally triggered by workflow_run off the sync, so it has no cron time to be
              // late against; its 06:47 cron is only a backstop. Age is the meaningful check.
              { file: 'nightly-emails.yml', label: 'Nightly Emails',
                maxAgeHours: 26 },
              { file: 'data-health.yml', label: 'Data Health Canary',
                maxAgeHours: 26, cronMinutesUtc: [10 * 60 + 41], maxDelayHours: 6, selfHeal: true },
              { file: 'content-data-snapshot.yml', label: 'Content Data Snapshot',
                maxAgeHours: 26, cronMinutesUtc: [9 * 60 + 26], maxDelayHours: 6, selfHeal: true },
              { file: 'freshness-check.yml', label: 'Data Freshness Check',
                maxAgeHours: 12, cronMinutesUtc: [28, 6 * 60 + 28, 12 * 60 + 28, 18 * 60 + 28],
                maxDelayHours: 6, selfHeal: true },
              // COMMENTED OUT UNTIL THE CRON IS ARMED. weekly-data-drop.yml ships with its
              // schedule off, so watching it would report a missed run every four hours
              // forever — and an alert that is always firing is one nobody reads, which is
              // the same reason the data-health canary went unnoticed while it was red.
              // UNCOMMENT THIS in the same change that uncomments the cron.
              //
              // maxAgeHours is 8 days, not 2x the weekly cadence: at 2x we would sit silent
              // through two missed Thursdays. The LATE check is the sharp one — a weekly
              // send that slips half a day lands in a different part of the reader's week,
              // and a dropped weekly cron is a whole missing edition.
              // { file: 'weekly-data-drop.yml', label: 'Weekly Data Drop',
              //   maxAgeHours: 192, cronMinutesUtc: [11 * 60 + 40], maxDelayHours: 6 },
            ];

            const HOUR = 3600000;
            const now = Date.now();

            // Latest scheduled UTC instant at or before `at`, from daily minute-of-day slots.
            // Looks back one day as well so a slot early in the UTC day still resolves.
            const lastExpected = (at, minutes) => {
              const d = new Date(at);
              const midnight = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
              let best = -Infinity;
              for (const dayOffset of [0, -1]) {
                for (const m of minutes) {
                  const t = midnight + dayOffset * 24 * HOUR + m * 60000;
                  if (t <= at && t > best) best = t;
                }
              }
              return best;
            };

            // The LATE check needs a window of runs, not just the newest one: an extra
            // manual run must not be able to hide — or fake — a missed slot.
            const recentRuns = async (file) => {
              const res = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: file, per_page: 20,
              });
              return res.data.workflow_runs;
            };

            const latestRun = async (file, event) => {
              const params = {
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: file, per_page: 1,
              };
              if (event) params.event = event;
              const res = await github.rest.actions.listWorkflowRuns(params);
              return res.data.workflow_runs[0] || null;
            };

            const rows = [];
            const problems = [];
            const heal = [];

            for (const w of WATCHED) {
              let latest;
              try {
                latest = await latestRun(w.file);
              } catch (err) {
                // A 404 means the file is not on the default branch yet — a freshly-merged
                // workflow, not an outage. Report it, never alert on it.
                rows.push({ label: w.label, state: 'unknown',
                            detail: 'workflow not found (' + (err.status || 'error') + ')', reasons: [] });
                continue;
              }
              if (!latest) {
                // Same reasoning: no run history means nothing to be late for.
                rows.push({ label: w.label, state: 'unknown', detail: 'no runs yet', reasons: [] });
                continue;
              }

              const ageH = (now - new Date(latest.created_at).getTime()) / HOUR;
              const reasons = [];
              if (ageH > w.maxAgeHours) {
                reasons.push('MISSED: no run for ' + ageH.toFixed(1) + 'h (limit ' + w.maxAgeHours + 'h)');
                // MISSED only, never LATE: a late job may be mid-run right now and a second
                // dispatch would race it. A missed one has nothing to race.
                if (w.selfHeal) heal.push(w.file);
              }

              let delayH = null;
              if (w.cronMinutesUtc) {
                // Lateness belongs to the SLOT, not to any one run: once a trigger time has
                // passed, SOME run should have appeared within maxDelayHours of it.
                //
                // The previous version asked `latestRun(file, 'schedule')` instead. That broke
                // the moment a job moved off GitHub's scheduler onto pg_cron: its last
                // schedule-event run is frozen in history forever, so the same stale delay
                // would be re-reported every 4 hours until someone muted the alert. Reading
                // the slot instead is trigger-agnostic, and an extra manual run can no longer
                // fake a delay, because one more run never removes the on-time one.
                //
                // Anchor on the newest slot whose deadline has already passed, so a job is
                // never called late while it still has time to run.
                const expected = lastExpected(now - w.maxDelayHours * HOUR, w.cronMinutesUtc);
                const deadline = expected + w.maxDelayHours * HOUR;
                const recent = await recentRuns(w.file);
                const times = recent.map((r) => new Date(r.created_at).getTime());
                const onTime = times.filter((t) => t >= expected && t <= deadline).sort((a, b) => a - b)[0];
                if (onTime !== undefined) {
                  delayH = (onTime - expected) / HOUR;
                } else {
                  const after = times.filter((t) => t > deadline).sort((a, b) => a - b)[0];
                  delayH = ((after === undefined ? now : after) - expected) / HOUR;
                  reasons.push('LATE: nothing ran within ' + w.maxDelayHours + 'h of the ' +
                               new Date(expected).toISOString().slice(11, 16) + ' UTC slot (' +
                               delayH.toFixed(1) + 'h' + (after === undefined ? ' and counting' : '') + ')');
                }
              }

              rows.push({
                label: w.label,
                state: reasons.length ? 'problem' : 'ok',
                detail: 'last run ' + ageH.toFixed(1) + 'h ago (' + (latest.conclusion || latest.status) +
                        ') at ' + latest.created_at +
                        (delayH === null ? '' : '; cron delay ' + delayH.toFixed(1) + 'h'),
                reasons,
              });
              if (reasons.length) problems.push(w.label);
            }

            const line = (r) =>
              (r.state === 'problem' ? '[!] ' : r.state === 'unknown' ? '[?] ' : '[ok] ') +
              r.label + ' — ' + r.detail +
              (r.reasons.length ? '\n      ' + r.reasons.join('\n      ') : '');

            const report = rows.map(line).join('\n');
            console.log(report);
            await core.summary.addHeading('Schedule Watchdog', 2).addCodeBlock(report).write();

            core.setOutput('problem', problems.length ? 'true' : 'false');
            core.setOutput('report', report);
            core.setOutput('names', problems.join(', '));
            core.setOutput('heal', heal.join(','));

      # Re-fire a missed job instead of only complaining about it. On 2026-09-15 the Content
      # Data Snapshot dispatch was lost in flight; the content routine then drafted from the
      # previous day's figures at 10:00 UTC, and the repair was a human running one command
      # fifteen hours later. This does the same thing within four hours, unattended.
      #
      # WHY A PAT AND NOT GITHUB_TOKEN — this is the trap. A workflow_dispatch made with the
      # repository's own GITHUB_TOKEN does NOT start a run: GitHub blocks it to prevent
      # recursive workflows. The API still answers 204, so it would look like it worked and
      # quietly do nothing — precisely the silent failure this watchdog exists to catch. Use
      # the same fine-grained token pg_cron holds in the Supabase Vault (Actions read+write on
      # this repo and nothing else), added here as the WORKFLOW_DISPATCH_PAT secret.
      #
      # No secret set = no self-heal: the alert says so and the run still goes red, so this
      # can never quietly become a dependency nobody knows about.
      - name: Re-dispatch missed workflows
        id: heal
        if: steps.check.outputs.heal != '' && env.DISPATCH_PAT != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HEAL_FILES: ${{ steps.check.outputs.heal }}
        with:
          github-token: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
          script: |
            const files = (process.env.HEAL_FILES || '').split(',').filter(Boolean);
            const done = [];
            for (const file of files) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: file, ref: 'main',
                });
                done.push(file);
                console.log('re-dispatched ' + file);
              } catch (err) {
                // Report and keep going — one unfixable job must not block the others.
                console.log('could not re-dispatch ' + file + ': ' + (err.status || err.message));
              }
            }
            core.setOutput('dispatched', done.join(', '));

      # One open issue, commented on rather than re-opened — same anti-spam shape as
      # daily-sync.yml's notify-failure job.
      - name: Open / update schedule-drift issue
        if: steps.check.outputs.problem == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
          NAMES: ${{ steps.check.outputs.names }}
          HEAL_LIST: ${{ steps.check.outputs.heal }}
          HEAL_DONE: ${{ steps.heal.outputs.dispatched }}
        with:
          script: |
            const label = 'schedule-drift';
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                           '/actions/runs/' + context.runId;
            const healNote = !process.env.HEAL_LIST
              ? 'Nothing was eligible for automatic re-dispatch (LATE is never re-fired; daily-sync and nightly-emails are opt-out).'
              : process.env.HEAL_DONE
                ? 'Re-dispatched automatically: **' + process.env.HEAL_DONE + '** — look for a fresh run before doing anything by hand.'
                : '**Self-heal did not run.** Set the WORKFLOW_DISPATCH_PAT secret (fine-grained, Actions read+write) to enable it — GITHUB_TOKEN cannot start a workflow_dispatch.';
            const body = [
              '⏰ **Schedule problem: ' + process.env.NAMES + '**',
              '',
              '```',
              process.env.REPORT,
              '```',
              '',
              healNote,
              '',
              'GitHub dispatches schedule triggers on a best-effort basis: it defers them under',
              'load and drops them outright when the backlog is long enough. A pg_cron dispatch',
              'can also be lost in flight — `public.workflow_dispatch_log` holds the status code',
              'GitHub returned, and outlives pg_net\'s 6h response ttl (migration 145).',
              'Re-run a missed job by hand with "gh workflow run <file>".',
              '',
              '- Watchdog run: ' + runUrl,
              'cc @' + context.repo.owner,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⏰ Scheduled workflow missed or ran late', body, labels: [label],
              });
            }

      # Direct email too — issue notifications are easy to miss, and the whole point of this
      # watchdog is that the operator finds out BEFORE a user notices a missing email. Plain
      # curl, matching notify-failure: this job has no checkout, so notifyRun.ts is not
      # available here. No-ops cleanly when the secrets are unset; never fails the step.
      - name: Email schedule alert
        if: steps.check.outputs.problem == 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SYNC_ALERT_EMAIL: ${{ secrets.SYNC_ALERT_EMAIL }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          REPORT: ${{ steps.check.outputs.report }}
          NAMES: ${{ steps.check.outputs.names }}
          HEAL_LIST: ${{ steps.check.outputs.heal }}
          HEAL_DONE: ${{ steps.heal.outputs.dispatched }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$SYNC_ALERT_EMAIL" ]; then
            echo "(no email sent — set RESEND_API_KEY + SYNC_ALERT_EMAIL secrets)"; exit 0
          fi
          FROM="${ALERTS_FROM_EMAIL:-PureProperty Alerts <support@pureproperty.ca>}"
          if [ -z "$HEAL_LIST" ]; then
            HEAL_NOTE="Nothing was eligible for automatic re-dispatch."
          elif [ -n "$HEAL_DONE" ]; then
            HEAL_NOTE="Re-dispatched automatically: $HEAL_DONE — look for a fresh run before doing anything by hand."
          else
            HEAL_NOTE="Self-heal did not run — set the WORKFLOW_DISPATCH_PAT secret (Actions read+write) to enable it."
          fi
          # jq --arg does the escaping; never interpolate these values into JSON by hand.
          jq -n --arg from "$FROM" --arg to "$SYNC_ALERT_EMAIL" \
                --arg subject "⏰ PureProperty · scheduled workflow missed or ran late" \
                --arg names "$NAMES" --arg report "$REPORT" --arg url "$RUN_URL" \
                --arg heal "$HEAL_NOTE" \
                '{from: $from, to: $to, subject: $subject,
                  html: ("<p>⏰ Schedule problem: <b>" + $names + "</b></p><pre>" + $report
                         + "</pre><p><b>" + $heal + "</b></p><p>GitHub defers and sometimes drops schedule triggers under load, and a pg_cron dispatch can be lost in flight — <code>public.workflow_dispatch_log</code> holds the status code GitHub returned. <a href=\""
                         + $url + "\">View the watchdog run</a>, then re-run a missed job with <code>gh workflow run &lt;file&gt;</code>.</p>")}' \
            | curl -sS -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d @- \
            && echo "" && echo "Emailed $SYNC_ALERT_EMAIL" \
            || echo "email send failed (non-fatal)"

      # Go red last, so the issue and the email are already out. The red run is a third,
      # zero-config channel: GitHub mails the repo owner when a scheduled workflow fails.
      - name: Fail the run when the schedule is broken
        if: steps.check.outputs.problem == 'true'
        env:
          NAMES: ${{ steps.check.outputs.names }}
        run: |
          echo "Schedule problem: $NAMES"
          exit 1
