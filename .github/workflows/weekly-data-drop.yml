name: Weekly Data Drop

# The weekly market email (engagement plan WS2). Its own workflow, on its own schedule.
#
# DELIBERATELY NOT CHAINED TO THE SYNC. nightly-emails.yml rides `workflow_run` off the
# daily sync because its digest is compare-at-read against the freshly-written index — it
# MUST run after the data moves. This one must not. Two reasons, and both have bitten us:
#
#   1. SEND TIME. Chaining puts the send hour at the mercy of how long the sync took. A
#      03:44 UTC start plus a ~2h sync put the nightly digest out at 05:52; a delayed start
#      on 2026-08-27 put it out at 16:26 UTC — 12:26 PM in Toronto. A marketing email that
#      lands at an accidental hour is a marketing email nobody opens.
#   2. FAILURE COUPLING. `workflow_run` fires only on a sync that succeeded, so a red sync
#      would silently cancel the week. The Data Drop reads a NIGHTLY PRECOMPUTE, not the
#      live index — yesterday's boards answer today's email perfectly well, and the worker
#      refuses on its own if they are more than 48h old.
#
# Thursday 11:40 UTC = 07:40 EDT / 06:40 EST. Email sorts newest-first, so landing at 06:00
# buries the send under overnight mail by the time anyone looks; GitHub routinely defers
# `schedule` by 20-45 minutes, which puts the real arrival at 07:40-08:25 EDT — near the top
# of the inbox as the workday starts. That BAND is the target; the cron minute is only how we
# aim at it. `:40`, not `:00` — GitHub defers hardest at the top of the hour (see the WHY
# block in daily-sync.yml). The hour shifts once across DST; both times are fine and two
# month-gated crons are more moving parts than one hour is worth.
#
# Thursday also clears Monday's inbox pile, avoids Friday's dead zone, gives the reader two
# days of runway before Saturday showings, and does not collide with monthly-market-brief.yml
# (3rd-5th, 12:30 UTC).
#
# REGISTERED IN schedule-watchdog.yml. A dropped weekly cron is a whole missing week, and
# GitHub dropped one outright on 2026-08-28.
#
# ─────────────────────────────────────────────────────────────────────────────
# ARMED 2026-09-06 (owner decision). The cron above runs from the DEFAULT BRANCH, so it is
# live from the merge and the first automatic send is the next Thursday.
#
# Of the three preconditions this block used to list, two are met by the hand send that
# goes out the same day: a real send has gone out and been read. The third is NOT:
#   OPEN: SENDERS.dataDrop still sends from data@pureproperty.ca, the apex domain that
#   also carries the nightly alerts and the login mail. A `send.` subdomain keeps bulk
#   reputation away from transactional reputation, so a bad week for this stream cannot
#   take the alerts down with it. At this list size the exposure is small, but it grows
#   with every recipient — see senders.ts TODO(Unit 1).
#
# The ramp itself has not been skipped: `segment` still DEFAULTS to `saved`, so the
# scheduled Thursday run mails the people with a saved market, and widening to `all` stays
# a deliberate act.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '40 11 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render and report without sending'
        type: boolean
        default: false
      test_to:
        description: 'Send only to this address (no gating, no lifecycle stamp)'
        type: string
        required: false
      segment:
        description: 'Who to send to'
        type: choice
        default: saved
        options:
          - saved   # only users with a saved market — ramp step 1 (127 people)
          - all     # everyone not opted out — ramp step 2
      # scope and region shape a TEST send only. The worker reads both inside its
      # `if (TEST_TO)` branch, so they cannot alter what a real run mails — but a dispatcher
      # who does not know that would believe otherwise, so the run step fails loudly instead.
      scope:
        description: 'Payload shape — TEST SENDS ONLY, requires test_to'
        type: choice
        default: auto
        options:
          - auto      # market when a region resolves, province otherwise
          - province  # the shape 70.6% of the base receives — check this one
          - market
      region:
        description: 'Market to render, e.g. Toronto — TEST SENDS ONLY, requires test_to'
        type: string
        required: false

permissions:
  contents: read

# One send at a time. Never cancel-in-progress: a cancelled sender can leave a batch
# delivered with its week unstamped, which would mail those people again on the next run.
concurrency:
  group: weekly-data-drop
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUMMARY_FILE: data-drop.log
    # `shell: bash` is load-bearing: it runs every step with `-eo pipefail`, where the
    # DEFAULT run shell is `bash -e` with NO pipefail, so `... | tee -a` exits with tee's
    # status -- always 0. A send that failed would report a GREEN job. Found via PR #498.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # match daily-sync (@supabase/realtime-js needs Node >=22)

      - name: Install Dependencies
        run: npm ci

      # Reads the nightly region_metrics + competition precomputes, scopes each recipient to
      # their saved markets (province-wide when they have none), and sends. Refuses outright
      # if the boards are stale, and turns the run red if too many recipients yielded no
      # headline — a quiet quality collapse should not look like a quiet week.
      - name: Send Weekly Data Drop
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.ALERTS_UNSUBSCRIBE_SECRET }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ -n "${{ inputs.test_to }}" ]; then ARGS="$ARGS --to=${{ inputs.test_to }}"; fi
          if [ -n "${{ inputs.segment }}" ]; then ARGS="$ARGS --segment=${{ inputs.segment }}"; fi
          # Refuse a shape override on a real run. The worker would ignore it silently, and a
          # silent no-op on a send to the whole base is the worst way to learn that.
          if [ "${{ inputs.scope }}" != "auto" ] || [ -n "${{ inputs.region }}" ]; then
            if [ -z "${{ inputs.test_to }}" ]; then
              echo "::error::scope and region apply to test sends only. Set test_to, or leave scope on 'auto' and region empty."
              exit 1
            fi
          fi
          if [ "${{ inputs.scope }}" != "auto" ]; then ARGS="$ARGS --scope=${{ inputs.scope }}"; fi
          if [ -n "${{ inputs.region }}" ]; then ARGS="$ARGS --region=${{ inputs.region }}"; fi
          npx tsx scripts/worker/dataDrop.ts $ARGS 2>&1 | tee -a "$SUMMARY_FILE"

      # Standard notifyRun.ts convention: report on success as well as failure, so a sender
      # that silently stops mailing anybody is visible. The log it quotes carries the
      # sent/gated/skipped counts and the headline-kind spread — if `price` wins most weeks
      # the email has decayed into a newsletter of levels and that is the tell.
      - name: Notify operator
        if: always()
        env:
          JOB_NAME: Weekly Data Drop
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          SYNC_ALERT_EMAIL: ${{ secrets.SYNC_ALERT_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/worker/notifyRun.ts
