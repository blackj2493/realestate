name: Sync Open Houses

# Copies the public open houses from the PropTx OpenHouse resource into public.open_houses
# (migration 177), with each listing's City, for /open-houses/{city}. Writes the database only;
# no commit, no deploy (the pages read the table and revalidate hourly).
#
# CADENCE: every 6 hours. Agents add weekend open houses from Wednesday to Saturday.
#
# NEW-WORKFLOW GOTCHA: workflow_dispatch only activates once this file is on main. Seed the
# first run with the Actions "Run workflow" button, or: gh workflow run sync-open-houses.yml
on:
  # NOT scheduled by GitHub (it drops `schedule` runs under load). Supabase pg_cron POSTs a
  # workflow_dispatch at :23 every 6 hours — supabase/migrations/177_open_houses.sql.
  # Change the time in cron.job, NOT here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-open-houses
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Sync open houses
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROPTX_IDX_TOKEN: ${{ secrets.PROPTX_IDX_TOKEN }}
        # pipefail: `tsx … | tee` otherwise returns tee's 0 and a Fatal goes green.
        run: |
          set -o pipefail
          npx tsx scripts/data/syncOpenHouses.ts --write 2>&1 | tee open-houses-run.log
