name: Daily Real Estate Sync

# MANUAL FALLBACK ONLY. The scheduled daily sync now runs on RAILWAY CRON
# (npm run sync:daily → scripts/worker/dailySync.ts), because GitHub Actions' egress
# to Supabase began truncating REST responses ("premature close") while Supabase and
# the Railway app stayed healthy. See docs/railway-cron-setup.md. This workflow is kept
# as a free, on-demand backup you can trigger by hand when GitHub's path is healthy.
# The schedule is intentionally removed so it can't auto-run, fail, and double-sync.
on:
  workflow_dispatch:

# Least privilege: checkout needs contents:read; the failure notifier opens an issue.
permissions:
  contents: read
  issues: write

jobs:
  run-ingester:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # was '20'; @supabase/realtime-js needs native WebSocket (Node >=22)

      - name: Install Dependencies
        run: npm ci # Uses package-lock.json for a clean install

      - name: Run Daily Sync Script
        # The load-bearing core sync. Observed runtime ~1h; 120m gives headroom while
        # bounding a hung fetch so it can't consume the whole job and starve the steps
        # below (a hang here exits non-zero, which is the correct, visible failure —
        # the cursor is NOT advanced on failure, CLAUDE.md §12).
        timeout-minutes: 120
        env:
          # FEED ISOLATION: IDX and VOW are TWO DISTINCT TRREB tokens with no fallback.
          # Read by scripts/worker/ingester.ts:242-243.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROPTX_IDX_TOKEN: ${{ secrets.PROPTX_IDX_TOKEN }}
          PROPTX_VOW_TOKEN: ${{ secrets.PROPTX_VOW_TOKEN }}
          # ingester.ts imports sync.ts, which constructs a Typesense admin client at
          # module load and HARD-THROWS without this key (sync.ts:38). Required for the
          # ETL to index listings into Typesense — not optional.
          TYPESENSE_ADMIN_API_KEY: ${{ secrets.TYPESENSE_ADMIN_API_KEY }}
        run: npx tsx scripts/worker/ingester.ts sync

      # Refresh precomputed condo fee/sqft aggregates from the freshly-synced VOW data.
      # Reads raw_vow_sold READ-ONLY and writes the separate condo_fee_stats table; needs
      # only the Supabase credentials (no TRREB tokens). Keeps the Fee Stability card ≤24h fresh.
      - name: Refresh Condo Fee Stats
        # Additive aggregation for a single listing-page card — must never break the
        # core daily sync. timeout-minutes bounds it so a hang here can't cascade into
        # skipping the revalidate step at the end (the 2026-06-16→24 outage root cause).
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/admin/refresh-condo-fee-stats.ts --apply

      # Refresh the precomputed prior-sale ledger from the freshly-synced VOW data.
      # Reads raw_vow_sold READ-ONLY and writes the separate property_sale_history table;
      # needs only the Supabase credentials (no TRREB tokens). Powers the listing-page
      # Sale History + Price Timeline sold markers. Additive — must never break the core
      # daily sync, so continue-on-error.
      - name: Refresh Property Sale History
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/admin/refresh-property-sale-history.ts --apply

      # Refresh the AVM sqft-calibration table (median grossed room-sum GLA per
      # CityRegion + sub-type + LivingAreaRange bucket) from active listings' room
      # dimensions. It's the AVM's no-rooms fallback so a coarse MLS range can't
      # drive the estimate. Reads listings only, writes the separate
      # avm_sqft_calibration table; Supabase creds only. Additive — must never
      # break the core sync, so continue-on-error.
      - name: Refresh AVM Sqft Calibration
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/admin/refresh-sqft-calibration.ts --apply

      # Refresh the AVM trend index + community offset (migration 024) from the
      # freshly-synced VOW data. Splits price into city × sub-type half-year trend
      # and community vs city offset so the AVM anchor can be both LOCAL in level
      # and CURRENT in trend, even when 0 recent local comps exist. Reads
      # raw_vow_sold READ-ONLY (scalar columns only — respects the Disk IO budget)
      # and writes the separate avm_trend_index / avm_community_offset tables;
      # Supabase creds only. Additive — must never break the core sync, so
      # continue-on-error.
      - name: Refresh AVM Trend + Offset
        continue-on-error: true
        timeout-minutes: 15
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/admin/refresh-avm-trend-offset.ts --apply

      # Precompute the PureProperty Estimate (AVM) + resolved GLA/$psf per active
      # listing into property_estimates, so the Compare page reads a ready-made
      # estimate in one batched lookup instead of running the multi-query AVM live.
      # Runs AFTER the sqft-calibration step so it can use the fresh no-rooms
      # fallback; reads listings + raw_vow_sold (anchor) READ-ONLY, writes the
      # separate property_estimates table; Supabase creds only. Additive — must
      # never break the core sync, so continue-on-error.
      #
      # DELTA (--since ~25h): only re-estimate listings re-synced today. The full-table
      # form scanned ~77k active listings nightly (~4.5h) and blew the 6h job ceiling —
      # which silently SKIPPED the "Revalidate Synced Listings" step below, so price
      # changes stopped reaching the listing pages (outage 2026-06-16→24). A listing's
      # estimate inputs only change when the sync re-ingests it, so the delta pass keeps
      # the same rows fresh in minutes. Run the bare --apply (full table) form via
      # workflow_dispatch periodically to re-base every row against the latest anchors.
      - name: Refresh Property Estimates
        continue-on-error: true
        timeout-minutes: 30
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/admin/refresh-property-estimates.ts --apply --since "$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

      # Precompute geo "Things to Know" flags (flood now; rail/traffic later) for
      # listings synced in the last day, into listing_geo_flags. PUBLIC-records
      # PostGIS spatial joins — reads listings, writes the separate listing_geo_flags
      # table. Unlike the refresh steps above it uses raw pg, so it needs the
      # Session-pooler DATABASE_URL secret (CLAUDE.md §12), NOT the Supabase REST
      # creds. Delta window (~25h) covers the daily cadence with margin. Additive —
      # must never break the core sync, so continue-on-error; the step errors out
      # cleanly (and is skipped) if the DATABASE_URL secret is unset.
      - name: Enrich Geo Things-to-Know Flags
        continue-on-error: true
        timeout-minutes: 25
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/worker/enrichGeoFlags.ts --since "$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

      # Email each user a digest of price drops on their watched properties, using
      # the freshly-synced Typesense index. Additive + must never break the core
      # sync, so continue-on-error. No-ops cleanly if RESEND_API_KEY is unset.
      - name: Send Watchlist Alerts
        continue-on-error: true
        timeout-minutes: 15
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TYPESENSE_ADMIN_API_KEY: ${{ secrets.TYPESENSE_ADMIN_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/worker/alerts.ts

      # Refresh cached listing detail for everything synced today so nightly changes
      # appear immediately instead of within the page's 1h TTL. Additive — must never
      # break the core sync, so continue-on-error; no-ops cleanly if REVALIDATE_SECRET
      # is unset. Runs last: it only reads listings.synced_at, set by the sync above.
      # The per-step timeouts above sum to well under the 6h job ceiling, so this step
      # is now GUARANTEED to be reached even if every preceding refresh step times out.
      - name: Revalidate Synced Listings
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: npx tsx scripts/worker/revalidateListings.ts

  # ── Failure notifier ────────────────────────────────────────────────────────
  # Fires ONLY when run-ingester fails — i.e. the core sync step exits non-zero
  # (ingester.ts now exits 1 on a failed sync) or hits its timeout. The additive
  # refresh steps are continue-on-error, so they never trip this; this alerts on a
  # REAL sync failure only. Opens a GitHub issue (which emails the repo owner — zero
  # extra secrets); to avoid daily spam it comments on the existing open issue instead
  # of creating a new one when a 'sync-failure' issue is already open.
  notify-failure:
    needs: run-ingester
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open / update sync-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'sync-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `🔴 **${context.workflow}** failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              `- Trigger: ${context.eventName}`,
              ``,
              `The core sync exited non-zero (or timed out). The sync_state cursor is preserved on failure, so the next run re-attempts the same window.`,
              ``,
              `cc @${context.repo.owner}`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🔴 Daily sync failed`, body, labels: [label],
              });
            }