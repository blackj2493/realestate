name: Refresh Walkability / Amenity Proximity

# Keeps the nearest-grocery / nearest-recreation ("walkability") fields fresh on EVERY
# listing by re-propagating the committed amenities snapshot across all Typesense docs.
#
# WHY: amenity distances are computed once, at ingest, from data/gta-amenities.json. Listings
# ingested before the dataset existed keep zero/sentinel distances forever. This re-propagates
# the current snapshot to every doc (fixes the "computed once, then frozen" staleness).
#
# SOURCE-REFRESH CAVEAT: the amenities SOURCE (data/gta-amenities.json) is built from an
# Overture Maps extract by a PYTHON step (scripts/admin/overture_amenities.py →
# build-amenities-dataset.ts). That extract isn't committed and the CI runner is Node-only, so
# this job does NOT rebuild the source — it re-propagates the committed snapshot. When Overture
# publishes a newer release, rebuild locally (python … → build-amenities-dataset.ts) and commit
# the regenerated data/gta-amenities.json; the next run then propagates it. (Overture releases
# roughly quarterly; amenities drift slowly, so the committed snapshot stays valid a while.)
#
# CADENCE: quarterly (5th of Feb/May/Aug/Nov, 07:00 UTC — offset from the schools refresh).
on:
  # NOT scheduled by GitHub. GitHub runs `schedule` at lowest priority and drops it
  # under load, hardest at minute :00 — which is where this job used to sit. Supabase
  # pg_cron POSTs a workflow_dispatch at 07:00 UTC on the 5th of Feb, May, Aug and Nov; see
  # supabase/migrations/128_pg_cron_weekly_monthly.sql. Change the time in cron.job,
  # NOT here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-amenities
  cancel-in-progress: false

jobs:
  refresh-amenities:
    runs-on: ubuntu-latest
    env:
      SUMMARY_FILE: amenities-run.log
    # `shell: bash` is load-bearing, not cosmetic: it runs every step with `-eo pipefail`,
    # where the DEFAULT run shell is `bash -e` with NO pipefail. Each `... | tee -a` step
    # below would otherwise exit with tee's status -- always 0 -- so a failing script would
    # report a GREEN job and email "completed OK". Found via PR #498.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      # Re-propagate nearest-grocery / nearest-recreation distances onto EVERY Typesense doc
      # (reads the committed data/gta-amenities.json + Typesense only — no Supabase, no Python).
      # Idempotent: patches the same fields with action:'update', so re-running is safe.
      - name: Backfill amenity fields into Typesense
        env:
          TYPESENSE_ADMIN_API_KEY: ${{ secrets.TYPESENSE_ADMIN_API_KEY }}
        run: npx tsx scripts/admin/backfill-amenity-fields.ts --apply 2>&1 | tee -a "$SUMMARY_FILE"

      - name: Notify operator
        if: always()
        env:
          JOB_NAME: Walkability / Amenities Refresh
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          SYNC_ALERT_EMAIL: ${{ secrets.SYNC_ALERT_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/worker/notifyRun.ts
